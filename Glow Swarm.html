<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow Swarm</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #120d2b; --ink: #f4efff; --muted: #a99fd1;
    --panel: rgba(30, 22, 66, 0.78); --line: rgba(255,255,255,.16); --accent: #ffb703;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .hint { position: fixed; top: 16px; left: 0; right: 0; text-align: center; pointer-events: none;
    color: var(--muted); font-size: 15px; transition: opacity .6s; padding: 0 16px; }
  .hint b { color: var(--ink); font-size: 22px; display: block; margin-bottom: 4px; }
  .hint.gone { opacity: 0; }
  .status { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 28px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
    font-size: 14px; text-align: center; display: none; }
  .status.show { display: block; }
  #cam { position: fixed; left: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 140px;
    border-radius: 12px; border: 1px solid var(--line); transform: scaleX(-1); opacity: .65; display: none; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; backdrop-filter: blur(8px); max-width: calc(100% - 20px); overflow-x: auto; }
  button { font: inherit; color: var(--ink); background: transparent; border: 0; padding: 10px 14px;
    border-radius: 999px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(255,255,255,.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button[aria-pressed="true"] { background: var(--accent); color: #2a1a00; font-weight: 700; }
  .sep { width: 1px; background: var(--line); margin: 6px 2px; flex: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="Glowing particles that follow your pointer or hand"></canvas>
<div class="hint" id="hint"><b>Move your mouse or finger</b>Press and hold to pull the glow in. Pick a mode below.</div>
<div class="status" id="status" role="status"></div>
<video id="cam" playsinline muted></video>

<div class="bar" role="group" aria-label="Mode">
  <button data-mode="swarm" aria-pressed="true">Swarm</button>
  <button data-mode="orbit" aria-pressed="false">Orbit</button>
  <button data-mode="fountain" aria-pressed="false">Fountain</button>
  <button data-mode="repel" aria-pressed="false">Repel</button>
  <button data-mode="ribbon" aria-pressed="false">Ribbon</button>
  <button data-mode="ring" aria-pressed="false">Ring</button>
  <button data-mode="burst" aria-pressed="false">Burst</button>
  <button data-mode="rain" aria-pressed="false">Rain</button>
  <span class="sep"></span>
  <button id="color" aria-label="Change colors">Colors</button>
  <button id="hand" aria-pressed="false">Hand</button>
</div>

<script>
// ---------- Setup ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const video = document.getElementById('cam');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function say(msg, ms) {
  statusEl.textContent = msg; statusEl.classList.add('show');
  clearTimeout(say.t);
  if (ms) say.t = setTimeout(() => statusEl.classList.remove('show'), ms);
}

// ---------- Colors ----------
const palettes = [
  { hue: 320, spread: 60 }, { hue: 190, spread: 50 },
  { hue: 20, spread: 40 },  { hue: 95, spread: 50 }
];
let paletteIndex = 0;

// ---------- Particles ----------
const COUNT = reduceMotion ? 250 : (W < 600 ? 450 : 900);
const particles = [];
for (let i = 0; i < COUNT; i++) {
  particles.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0,
    size: 1 + Math.random() * 2.2, hueOffset: (Math.random() - 0.5) * 2, seed: Math.random() * 1000 });
}

// ---------- Pointer (mouse, finger, or hand all feed this) ----------
const pointer = { x: W / 2, y: H / 2, down: false, active: false };
let burstPending = false;
const trail = [];            // recent pointer positions, used by Ribbon
function setDown(v) {
  if (v && !pointer.down) burstPending = true;   // a fresh press triggers Burst
  pointer.down = v;
}
let handOn = false, handSeen = false;
canvas.addEventListener('pointermove', e => {
  if (handOn) return;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; hint.classList.add('gone');
});
canvas.addEventListener('pointerdown', e => {
  if (handOn) return;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; hint.classList.add('gone');
  setDown(true); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', () => { if (!handOn) setDown(false); });
canvas.addEventListener('pointercancel', () => { if (!handOn) setDown(false); });

// ---------- Mode buttons ----------
let mode = 'swarm';
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b === btn));
  });
});
document.getElementById('color').addEventListener('click', () => {
  paletteIndex = (paletteIndex + 1) % palettes.length;
});

// ---------- Hand tracking (MediaPipe) ----------
let landmarker = null, lastVideoTime = -1;
const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const handBtn = document.getElementById('hand');

async function startHand() {
  say('Loading hand tracking...');
  try {
    if (!landmarker) {
      const { HandLandmarker, FilesetResolver } = await import(VISION + '/+esm');
      const files = await FilesetResolver.forVisionTasks(VISION + '/wasm');
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numHands: 1 });
      try { landmarker = await HandLandmarker.createFromOptions(files, opts('GPU')); }
      catch (e) { landmarker = await HandLandmarker.createFromOptions(files, opts('CPU')); }
    }
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    await video.play();
    video.style.display = 'block';
    handOn = true; handBtn.setAttribute('aria-pressed', 'true'); hint.classList.add('gone');
    say('Raise your hand. Point with your index finger, pinch to pull or burst.', 5000);
  } catch (err) {
    console.error(err);
    handOn = false; handBtn.setAttribute('aria-pressed', 'false');
    let why = (err && (err.message || err.name)) || 'unknown error';
    if (err && err.name === 'NotAllowedError') why = 'Camera is blocked. Click the camera icon in the address bar and allow it.';
    else if (err && err.name === 'NotFoundError') why = 'No camera found.';
    else if (location.hostname.endsWith('claude.ai') || location.hostname.endsWith('claudeusercontent.com')) why = 'The hosted page blocks the model download. Use the downloaded file. (' + why + ')';
    say('Hand tracking failed: ' + why, 12000);
  }
}
function stopHand() {
  handOn = false; handSeen = false; setDown(false);
  handBtn.setAttribute('aria-pressed', 'false');
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  video.srcObject = null; video.style.display = 'none'; statusEl.classList.remove('show');
}
handBtn.addEventListener('click', () => handOn ? stopHand() : startHand());

function readHand() {
  if (!handOn || !landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const lm = landmarker.detectForVideo(video, performance.now()).landmarks[0];
  if (!lm) { handSeen = false; setDown(false); return; }
  handSeen = true;
  const tip = lm[8], thumb = lm[4];                       // index fingertip, thumb tip
  const x = (1 - tip.x) * W, y = tip.y * H;               // mirror so it feels natural
  pointer.x += (x - pointer.x) * 0.5; pointer.y += (y - pointer.y) * 0.5; pointer.active = true;
  setDown(Math.hypot(tip.x - thumb.x, tip.y - thumb.y) < 0.06);   // pinch = press
}

// ---------- Animation loop ----------
let t = 0;
function frame() {
  t += 0.016;
  readHand();

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(18, 13, 43, 0.18)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  const pal = palettes[paletteIndex];
  const tx = pointer.active ? pointer.x : W / 2 + Math.cos(t * 0.8) * W * 0.25;
  const ty = pointer.active ? pointer.y : H / 2 + Math.sin(t * 1.1) * H * 0.2;
  const pull = pointer.down ? 2.4 : 1;

  trail.push({ x: tx, y: ty });
  if (trail.length > 140) trail.shift();

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const dx = tx - p.x, dy = ty - p.y;
    const dist = Math.hypot(dx, dy) + 0.001;
    const nx = dx / dist, ny = dy / dist;
    let drag = 0.94;

    if (mode === 'swarm') {
      p.vx += nx * 0.35 * pull + Math.cos(t + p.seed) * 0.05;
      p.vy += ny * 0.35 * pull + Math.sin(t + p.seed) * 0.05;
    } else if (mode === 'orbit') {
      p.vx += (-ny * 0.55 + nx * (dist - 140) * 0.002) * pull;
      p.vy += ( nx * 0.55 + ny * (dist - 140) * 0.002) * pull;
    } else if (mode === 'fountain') {
      drag = 0.995; p.vy += 0.12;
      if (p.y > H + 20 || p.x < -20 || p.x > W + 20) {
        p.x = tx + (Math.random() - 0.5) * 12; p.y = ty;
        const a = -Math.PI / 2 + (Math.random() - 0.5) * (pointer.down ? 2.4 : 1.0);
        const s = 4 + Math.random() * (pointer.down ? 12 : 7);
        p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
      }
    } else if (mode === 'repel') {
      if (dist < 220) { p.vx -= nx * (220 - dist) * 0.012 * pull; p.vy -= ny * (220 - dist) * 0.012 * pull; }
      p.vx += (Math.random() - 0.5) * 0.1; p.vy += (Math.random() - 0.5) * 0.1;
    } else if (mode === 'ribbon') {
      // each particle follows an older spot of the pointer path, so they form a snake
      const spot = trail[Math.floor((i / particles.length) * (trail.length - 1))];
      p.vx += (spot.x - p.x) * 0.07 + Math.cos(t * 3 + p.seed) * 0.4;
      p.vy += (spot.y - p.y) * 0.07 + Math.sin(t * 3 + p.seed) * 0.4;
    } else if (mode === 'ring') {
      const a = p.seed + t * 0.6, r = (pointer.down ? 60 : 120) + 25 * Math.sin(t * 2 + p.seed);
      p.vx += (tx + Math.cos(a) * r - p.x) * 0.06;
      p.vy += (ty + Math.sin(a) * r - p.y) * 0.06;
    } else if (mode === 'burst') {
      if (burstPending) {
        const power = (8 + Math.random() * 20) * Math.max(0.25, 1 - dist / 700);
        p.vx -= nx * power; p.vy -= ny * power;
      }
      p.vx += nx * 0.03 + (Math.random() - 0.5) * 0.15;
      p.vy += ny * 0.03 + (Math.random() - 0.5) * 0.15;
      drag = 0.975;
    } else if (mode === 'rain') {
      drag = 0.99; p.vy += 0.15;
      if (dist < 110) { p.vx -= nx * 1.2; p.vy -= ny * 1.2; }   // your pointer is an umbrella
      if (p.y >= H - 1) {
        p.vy *= -0.5; p.y = H - 1;
        if (Math.random() < 0.03) { p.y = -5; p.x = Math.random() * W; p.vy = 0; p.vx = 0; }
      }
    }

    p.vx *= drag; p.vy *= drag;
    p.x += p.vx; p.y += p.vy;

    if (mode !== 'fountain' && mode !== 'rain') {
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    } else if (mode === 'rain') {
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    }

    const speed = Math.hypot(p.vx, p.vy);
    const hue = pal.hue + p.hueOffset * pal.spread + speed * 4;
    ctx.fillStyle = `hsla(${hue}, 95%, ${55 + Math.min(speed * 3, 25)}%, 0.85)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size + Math.min(speed * 0.35, 3), 0, Math.PI * 2); ctx.fill();
  }
  burstPending = false;

  // draw a ring where your hand is pointing
  if (handOn && handSeen) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = pointer.down ? '#ffb703' : 'rgba(255,255,255,.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, pointer.down ? 10 : 18, 0, Math.PI * 2); ctx.stroke();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
